name: Workflow Lint

# Guards on the workflow definitions themselves. These run on pull requests because
# that is the only point they CAN run: release-pipeline.yml triggers on push to main,
# so a job added there with a broken egress allowlist would first execute during a
# real release, with the release riding on it.
on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  check-egress-allowlist:
    name: Egress allowlist covers apt + provider-harness hosts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443
            release-assets.githubusercontent.com:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PyYAML only - deliberately no apt-get here, so this job needs no Ubuntu
      # mirror access and stays outside the very rule it enforces.
      #
      # --require-hashes against a checked-in pin: an unpinned `pip install pyyaml`
      # takes whatever the index serves at run time, which is what Scorecard's
      # Pinned-Dependencies check flags. pip verifies every downloaded artifact
      # against requirements/pyyaml.txt and fails closed on a mismatch.
      - name: Install PyYAML
        run: |
          python3 -m pip install --user --disable-pip-version-check \
            --require-hashes -r .github/workflows/requirements/pyyaml.txt

      - name: Check egress allowlists
        run: ./.github/workflows/scripts/check-egress-allowlist.sh

      - name: Check version-format guard
        run: ./.github/workflows/scripts/version-format.test.sh
