name: PR Tests (Requires Approval)

on:
  # Manual trigger only. The workflow definition must be dispatched from the
  # default branch; the requested PR is checked out without provider secrets.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to test"
        required: true
        type: string

# Prevent concurrent test runs on the same PR
concurrency:
  group: pr-tests-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-tests:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Run Tests (Awaiting Approval)
    runs-on: ubuntu-latest

    # Environment with protection rules - requires admin approval
    # Note: You need to configure this environment in repo settings
    environment:
      name: pr-testing
      url: ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Validate PR number
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::pr_number must be a positive integer"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr_number }}/merge
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Make test script executable
        run: chmod +x .github/workflows/scripts/run-tests.sh

      - name: Run tests without provider credentials
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          echo "Running credential-free tests for PR #$PR_NUMBER"
          ./.github/workflows/scripts/run-tests.sh

  report-results:
    needs: run-tests
    if: always() && (needs.run-tests.result == 'success' || needs.run-tests.result == 'failure')
    name: Report PR Test Results
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Run the authenticated report on a fresh runner. The runner that executed
      # PR-controlled code never receives a write-capable GitHub token.
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443

      - name: Report test results
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TEST_RESULT: ${{ needs.run-tests.result }}
        run: |
          if [ "$TEST_RESULT" = "success" ]; then
            gh pr comment "$PR_NUMBER" --body "✅ **All credential-free tests passed successfully!**

            All test suites have completed without errors. This PR is ready for review.

            [View detailed results →](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          else
            gh pr comment "$PR_NUMBER" --body "❌ **Credential-free tests failed**

            One or more test suites failed. Please review the failures and update your PR.

            [View detailed results →](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
