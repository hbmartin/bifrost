name: Snyk checks

on:
  push:
    branches: [main, master, "**/*"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  snyk-open-source:
    name: Snyk Open Source (deps)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.snyk.io:443
            downloads.snyk.io:443
            files.pythonhosted.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            github.com:443
            iojs.org:443
            nodejs.org:443
            packages.microsoft.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            static.snyk.io:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (for UI)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25"

      - name: Install uv
        uses: step-security/setup-uv@edab89485182ad96613ff847804c272ab5d1e03f # v10.0.0
        with:
          version: "0.11.0"
          python-version: "3.11"

      - name: Sync Python dependencies (integrations)
        working-directory: tests/integrations/python
        run: uv sync --frozen

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Setup Go workspace
        run: make setup-workspace

      - name: Build
        run: make build LOCAL=1

      - name: Install Snyk CLI
        uses: maximhq/snyk-actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: v1.1303.2

      - name: Snyk test (all projects)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --detection-depth=4 --exclude=examples,tests --sarif-file-output=snyk.sarif || true

      - name: Upload SARIF
        if: always() && hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: snyk.sarif

  snyk-code:
    name: Snyk Code (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.snyk.io:443
            deeproxy.snyk.io:443
            downloads.snyk.io:443
            files.pythonhosted.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443
            github.com:443
            iojs.org:443
            nodejs.org:443
            packages.microsoft.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            registry.npmjs.org:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node (for UI)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "25"

      - name: Install uv
        uses: step-security/setup-uv@edab89485182ad96613ff847804c272ab5d1e03f # v10.0.0
        with:
          version: "0.11.0"
          python-version: "3.11"

      - name: Sync Python dependencies (integrations)
        working-directory: tests/integrations/python
        run: uv sync --frozen

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Setup Go workspace
        run: make setup-workspace

      - name: Build
        run: make build LOCAL=1

      - name: Install Snyk CLI
        uses: maximhq/snyk-actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: v1.1303.2

      - name: Snyk Code test
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --sarif-file-output=snyk-code.sarif || true

      - name: Upload SARIF
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: snyk-code.sarif
