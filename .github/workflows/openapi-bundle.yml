name: OpenAPI Bundle

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/openapi-bundle.yml"
      - "docs/openapi/**"
      - "!docs/openapi/openapi.json"

permissions:
  contents: write

jobs:
  bundle-openapi:
    name: Bundle OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            files.pythonhosted.org:443
            github.com:443
            pypi.org:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Hash-pinned rather than a bare `pip install pyyaml`: this job holds
      # contents: write and pushes a commit, so an unverified install here runs
      # attacker-controlled code with push access. Shares the pin file with
      # workflow-lint.yml.
      - name: Install dependencies
        run: pip install --require-hashes -r .github/workflows/requirements/pyyaml.txt

      - name: Bundle OpenAPI spec
        working-directory: ./docs/openapi
        run: python bundle.py

      - name: Commit and push changes
        if: github.event_name == 'push'
        run: |
          CURRENT_BRANCH="${GITHUB_REF_NAME:-main}"

          git add docs/openapi/openapi.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate openapi.json --skip-ci"
          git push origin "$CURRENT_BRANCH"
