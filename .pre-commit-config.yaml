repos:
  - repo: local
    hooks:
      - id: bifrost-static-staged
        name: Bifrost staged static checks
        entry: scripts/static-checks/pre-commit.sh
        language: system
        pass_filenames: true
        types: [file]
        exclude: '(^|/)(node_modules|dist|build)/|routeTree\.gen\.ts$|docs/openapi/openapi\.json$'
