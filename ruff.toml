target-version = "py311"
line-length = 100
extend-exclude = ["**/.venv", "**/venv", "**/__pycache__"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[lint.per-file-ignores]
"**/test_*.py" = ["B011"]
"**/*_test.py" = ["B011"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
